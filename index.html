<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Confessly</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>
body{
  margin:0;
  font-family:Poppins,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#7f5cff,#ff6ec4,#ffa36c);
  color:white;
}
.screen{display:none;max-width:600px;margin:auto;padding:40px}
.active{display:block}
.card{
  background:rgba(255,255,255,.15);
  border-radius:24px;
  padding:25px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  margin-top:12px;
  font-weight:600;
  cursor:pointer;
}
.opt-group{display:flex;gap:10px;margin-top:10px}
.opt{
  flex:1;
  padding:10px;
  text-align:center;
  border-radius:999px;
  background:rgba(255,255,255,.2);
  cursor:pointer;
}
.opt.active{background:#00ffb3;color:#111;font-weight:700}
.google-btn{
  position:fixed;
  top:12px;
  right:12px;
  background:white;
  color:#111;
  border:none;
  padding:6px 10px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  width:auto !important;
}
.google-btn img{
  width:16px;
  height:16px;
}
</style>
</head>

<body>

<button class="google-btn">
 <img src="https://www.google.com/favicon.ico">
  Sign in with Google
</button>

<div id="start" class="screen active">
  <div class="card">
    <h2>Confessly</h2>
    <button onclick="show('create')">Raum erstellen</button>
    <button onclick="show('join')">Raum beitreten</button>
  </div>
</div>

<div id="create" class="screen">
  <div class="card">

    <h3>Raumtyp</h3>
    <div class="opt-group">
      <div class="opt active" onclick="setRoomType('Community')">Community</div>
      <div class="opt" onclick="setRoomType('Freunde')">Freunde</div>
    </div>

    <div id="devicesBox" style="display:none">
      <h3>Anzahl Handys</h3>
      <div class="opt-group">
        <div class="opt active" onclick="setDevices('2+')">2+</div>
        <div class="opt" onclick="setDevices('1')">1</div>
      </div>
      <small>Maximal 20 Leute zulässig</small>
    </div>

    <h3>Spielmodus</h3>
    <div class="opt-group">
      <div class="opt active" onclick="setMode('Beichten')">Beichten</div>
      <div class="opt" onclick="setMode('Wahr/Falsch')">Wahr oder Falsch</div>
    </div>

    <h3>Usernamen</h3>
    <div class="opt-group">
      <div class="opt active" onclick="setNames(true)">Mit Namen</div>
      <div class="opt" onclick="setNames(false)">Ohne Namen</div>
    </div>

    <button onclick="createRoom()">Raum starten</button>
    <div id="createdCode"></div>
    <button onclick="show('start')">Zurück</button>
  </div>
</div>

<div id="join" class="screen">
  <div class="card">
    <h3>Code</h3>
    <input id="joinCode" placeholder="AB12CD">
    <input id="username" placeholder="Name" style="display:none">
    <button onclick="joinRoom()">Beitreten</button>
    <button onclick="show('start')">Zurück</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dnnweunvyoqagcpyccsr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1MSOjgqoEGBBm8Ya9qUrbg_WZxcP61l";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let roomType="Community";
let devices="2+";
let mode="Beichten";
let useNames=true;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setRoomType(t){
  roomType=t;
  document.getElementById("devicesBox").style.display =
    t==="Freunde"?"block":"none";
}

function setDevices(v){devices=v}
function setMode(v){mode=v}
function setNames(v){useNames=v}

async function createRoom(){
  const code = Math.random().toString(36).substring(2,8).toUpperCase();

  await supabase.from("rooms").insert({
    code,
    room_type: roomType,
    devices,
    mode,
    use_names: useNames
  });

  document.getElementById("createdCode").innerHTML =
    `<h2>Code: ${code}</h2>`;
}

async function joinRoom(){
  const code = joinCode.value.toUpperCase();
  const {data} = await supabase
    .from("rooms")
    .select("*")
    .eq("code",code)
    .single();

  if(!data){alert("Raum existiert nicht");return;}

  if(data.use_names){
    username.style.display="block";
    alert("Name eingeben und erneut klicken");
  }else{
    alert("Erfolgreich beigetreten!");
  }
}
</script>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // dein JS
</script>
</html>
